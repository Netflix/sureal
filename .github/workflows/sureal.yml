name: sureal
on:
  push:
  pull_request:

env:
  # Render matplotlib figures off-screen (tests save plots to disk)
  MPLBACKEND: Agg

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # setupmeta derives the version from git tags
          fetch-depth: 0
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test/requirements.txt
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Run tox tests
        run: |
          tox -e py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Check README and package metadata
        run: |
          tox -e docs
